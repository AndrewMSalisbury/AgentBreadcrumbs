# Viability task set, answers checked 2026-10-26: 24 easy tasks (8 each of hard_access,
# docs and coding), then 18 hard ones (`set: hard`, 6 per use case). No `set` means easy;
# `python run.py <condition> --set easy|hard` runs one set.
#
# question/expect:  expect is a list of regexes that must all match the agent's
#                   ANSWER line (case-insensitive).
# related:          a different question on the same site, for warm-related runs.
# check:            where the answer lives and a regex that proves it there, so
#                   `python run.py verify` can re-check answers before a run.
#                   `select` reduces a JSON response to dotted paths, as in fetch.
#
# hard_access pages need JavaScript or block plain fetches, but each site has an
# API that works. Versions drift: run verify first and update stale answers.

# --- hard_access ------------------------------------------------------------

- id: crates-serde-version
