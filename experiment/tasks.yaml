# Viability task set: 8 each of hard_access, docs and coding. Answers checked 2026-10-26.
#
# question/expect:  expect is a list of regexes that must all match the agent's
#                   ANSWER line (case-insensitive).
# related:          a different question on the same site, for warm-related runs.
# check:            where the answer lives and a regex that proves it there, so
#                   `python run.py verify` can re-check answers before a run.
#                   `select` reduces a JSON response to dotted paths, as in fetch.
#
# hard_access pages need JavaScript or block plain fetches, but each site has an
# API that works. Versions drift: run verify first and update stale answers.

# --- hard_access ------------------------------------------------------------

- id: crates-serde-version
  use_case: hard_access
  question: What is the latest stable version of the serde crate on crates.io?
  expect: ['1\.0\.229']
  check: {url: 'https://crates.io/api/v1/crates/serde', select: [crate.max_stable_version], pattern: '"1\.0\.229"'}
  related:
    question: What is the latest stable version of the tokio crate on crates.io?
    expect: ['1\.54\.1']
    check: {url: 'https://crates.io/api/v1/crates/tokio', select: [crate.max_stable_version], pattern: '"1\.54\.1"'}

- id: npm-zod-version
  use_case: hard_access
  question: What is the latest version of the zod package on npmjs.com?
  expect: ['4\.6\.7']
  check: {url: 'https://registry.npmjs.org/zod/latest', select: [version], pattern: '"4\.6\.7"'}
  related:
    question: What is the latest version of the vite package on npmjs.com?
    expect: ['8\.3\.5']
    check: {url: 'https://registry.npmjs.org/vite/latest', select: [version], pattern: '"8\.3\.5"'}

- id: bundlephobia-zod-gzip
  use_case: hard_access
  question: According to bundlephobia.com, what is the minified + gzipped size of the latest zod, in bytes?
  expect: ['88,?906']
  check: {url: 'https://bundlephobia.com/api/size?package=zod', select: [gzip], pattern: '88906'}
  related:
    question: According to bundlephobia.com, what is the minified + gzipped size of the latest dayjs, in bytes?
    expect: ['3,?062']
    check: {url: 'https://bundlephobia.com/api/size?package=dayjs', select: [gzip], pattern: '3062'}

