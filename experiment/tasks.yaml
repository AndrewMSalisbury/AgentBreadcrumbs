# --- docs: picking the right page and section --------------------------------

- id: stripe-live-rate-limit
  use_case: docs
  question: What is Stripe's global API rate limit in live mode?
  expect: ['\b100\b']
  check: {url: 'https://docs.stripe.com/rate-limits', pattern: 'Live mode: 100 requests per second'}
  related:
    question: How many payout create requests per second does Stripe's Payouts API allow?
    expect: ['\b15\b']
    check: {url: 'https://docs.stripe.com/rate-limits', pattern: '15 \[create\]\([^)]*\) requests per second'}

- id: github-unauth-rate-limit
  use_case: docs
  question: What is the GitHub REST API primary rate limit for unauthenticated requests?
  expect: ['\b60\b']
  check: {url: 'https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api', pattern: 'unauthenticated requests is 60 requests per hour'}
  related:
    question: What is the GitHub REST API rate limit for GITHUB_TOKEN in GitHub Actions (non-Enterprise)?
    expect: ['1,?000']
    check: {url: 'https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api', pattern: 'GITHUB_TOKEN` is 1,000 requests per hour per repository'}

- id: cloudflare-workers-cpu
  use_case: docs
  question: What is the CPU time limit per request for Cloudflare Workers on the Free plan?
  expect: ['\b10 ?ms|10 millisecond']
  check: {url: 'https://developers.cloudflare.com/workers/platform/limits/', pattern: 'CPU time\]\(#cpu-time\) \| 10 ms'}
  related:
    question: How many subrequests per request can a Cloudflare Worker make on the Free plan?
    expect: ['\b50\b']
    check: {url: 'https://developers.cloudflare.com/workers/platform/limits/', pattern: 'Subrequests\]\(#subrequests\) \| 50/request'}

- id: letsencrypt-registered-domain
  use_case: docs
  question: How many certificates can Let's Encrypt issue per registered domain, and over what period?
  expect: ['\b50\b', '7 days|week|168 hours']
  check: {url: 'https://letsencrypt.org/docs/rate-limits/', pattern: 'Up to 50 certificates can be issued per registered domain'}
  related:
    question: How many certificates can Let's Encrypt issue for the exact same set of identifiers, and over what period?
    expect: ['\b5\b', '7 days|week|168 hours']
    check: {url: 'https://letsencrypt.org/docs/rate-limits/', pattern: 'Up to 5 certificates can be issued per exact same set of identifiers every 7 day'}

- id: slack-tier3-limit
  use_case: docs
  question: What is the rate limit for Slack Web API Tier 3 methods?
  expect: ['\b50\b']
  check: {url: 'https://docs.slack.dev/apis/web-api/rate-limits', pattern: 'Tier 3\s+50\+ per minute'}
  related:
    question: How often can a Slack app post messages to a single channel, per the Web API rate limit docs?
    expect: ['\b(1|one)\b']
    check: {url: 'https://docs.slack.dev/apis/web-api/rate-limits', pattern: 'no more than one message per second per channel'}

- id: vercel-function-body
  use_case: docs
  question: What is the maximum request or response body size for a Vercel Function?
  expect: ['4\.5 ?MB']
  check: {url: 'https://vercel.com/docs/functions/limitations', pattern: 'response body of a Vercel Function is 4\.5 MB'}
  related:
    question: What is the maximum duration of a Vercel Function on the Pro plan (not the extended beta maximum)?
    expect: ['\b800']
    check: {url: 'https://vercel.com/docs/functions/limitations', pattern: 'Pro and Enterprise: 300s default, 800s maximum'}

- id: discord-global-rate-limit
  use_case: docs
  question: What is the Discord API global rate limit for bots?
  expect: ['\b50\b']
  check: {url: 'https://docs.discord.com/developers/topics/rate-limits', pattern: 'All bots can make up to 50 requests per second'}
  related:
    question: What is Discord's invalid request limit before an IP is temporarily banned?
    expect: ['10,?000', '10 minutes']
    check: {url: 'https://docs.discord.com/developers/topics/rate-limits', pattern: '10,000 per 10 minutes'}

- id: dockerhub-unauth-pulls
  use_case: docs
  question: What is the Docker Hub pull rate limit for unauthenticated users?
  expect: ['\b100\b', '6 hours']
  check: {url: 'https://docs.docker.com/docker-hub/usage/', pattern: 'Unauthenticated users \| 100 per IPv4 address'}
  related:
    question: What is the Docker Hub pull rate limit for Personal (authenticated) users?
    expect: ['\b200\b', '6 hours']
    check: {url: 'https://docs.docker.com/docker-hub/usage/', pattern: 'Personal \(authenticated\) \| 200'}

# --- coding: large or noisy reference pages ----------------------------------

- id: pathlib-expanduser
  use_case: coding
  question: In the Python 3 docs, which pathlib method corresponds to os.path.expanduser?
  expect: ['expanduser']
  check: {url: 'https://docs.python.org/3/library/pathlib.html', pattern: 'os\.path\.expanduser\(\)`\]\([^)]*\) \| \[`Path\.expanduser\(\)'}
  related:
    question: In the Python 3 docs, which pathlib method corresponds to os.path.samefile?
    expect: ['samefile']
    check: {url: 'https://docs.python.org/3/library/pathlib.html', pattern: 'os\.path\.samefile\(\)`\]\([^)]*\) \| \[`Path\.samefile\(\)'}

- id: python-json-bytes
  use_case: coding
  question: In the Python 3 docs, since which version does json.loads accept bytes or bytearray input?
  expect: ['3\.6']
  check: {url: 'https://docs.python.org/3/library/json.html', pattern: 'Changed in version 3\.6:[^.]*can now be of (type )?\[?`?bytes'}
  related:
    question: In the Python 3 docs, in which version was json.JSONDecodeError added?
    expect: ['3\.5']
    check: {url: 'https://docs.python.org/3/library/json.html', pattern: 'colno\[¶\]\(#json\.JSONDecodeError\.colno\)[\s\S]{0,120}Added in version 3\.5'}

- id: node-readstream-highwatermark
  use_case: coding
  question: In the Node.js fs docs, what is the default highWaterMark for fs.createReadStream?
  expect: ['64 ?\* ?1024|64 ?KiB|64 ?KB|65,?536']
  check: {url: 'https://nodejs.org/api/fs.html', pattern: 'highWaterMark` \[`<integer>`\]\([^)]*\) \*\*Default:\*\* `64 \* 1024`'}
  related:
    question: In the Node.js fs docs, what is the default mode for fs.mkdir?
    expect: ['0o?777']
    check: {url: 'https://nodejs.org/api/fs.html', pattern: 'for more details\. \*\*Default:\*\* `0o777`'}

- id: django-data-upload-max
  use_case: coding
  question: In the Django settings reference, what is the default value of DATA_UPLOAD_MAX_MEMORY_SIZE?
  expect: ['2621440|2\.5 ?MB']
  check: {url: 'https://docs.djangoproject.com/en/stable/ref/settings/', pattern: 'DATA_UPLOAD_MAX_MEMORY_SIZE`\[¶\]\([^)]*\)\s+Default: `2621440`'}
  related:
    question: In the Django settings reference, what is the default value of SESSION_COOKIE_AGE?
    expect: ['1209600|2 weeks|two weeks|14 days']
    check: {url: 'https://docs.djangoproject.com/en/stable/ref/settings/', pattern: 'SESSION_COOKIE_AGE`\[¶\]\([^)]*\)\s+Default: `1209600`'}

- id: go-maxidleconnsperhost
  use_case: coding
  question: In Go's net/http package docs, what is the value of DefaultMaxIdleConnsPerHost?
  expect: ['\b2\b']
  check: {url: 'https://pkg.go.dev/net/http', pattern: 'const DefaultMaxIdleConnsPerHost = 2'}
  related:
    question: In Go's net/http package docs, what is the value of DefaultMaxHeaderBytes?
    expect: ['1 ?<< ?20|1 ?MB|1,?048,?576|1 MiB']
    check: {url: 'https://pkg.go.dev/net/http', pattern: 'const DefaultMaxHeaderBytes = 1 << 20'}

- id: k8s-termination-grace
