  # 0.4.3103 or any later release: 0.4.3107 was out by 2026-11-04. Rows from before then were
  # graded against 0.4.3103 alone and keep that grade.
  expect: ['\b(0\.4\.(310[3-9]|31[1-9]\d|3[2-9]\d\d|[4-9]\d{3}|\d{5,})|0\.([5-9]|\d\d)\.\d+|[1-9]\d*\.\d+\.\d+)\b']
  check: {url: 'https://open-vsx.org/api/rust-lang/rust-analyzer', select: [version], pattern: '"(0\.4\.(310[3-9]|31[1-9]\d|3[2-9]\d\d|[4-9]\d{3}|\d{5,})|0\.([5-9]|\d\d)\.\d+|[1-9]\d*\.\d+\.\d+)"'}
  related:
    question: What is the latest version of the Prettier extension (esbenp.prettier-vscode) on open-vsx.org?
    expect: ['12\.4\.0']
    check: {url: 'https://open-vsx.org/api/esbenp/prettier-vscode', select: [version], pattern: '"12\.4\.0"'}

