# Popular-page set (head-0.1): does a lookup on a page many developers use take several fetches?
# 24 canonical reference pages of widely used technologies, none used by tasks.yaml. Two facts
# per page, taken near 30% and 70% of the cleaned page where a crisp fact was there, otherwise
# the nearest one. Run with cold-nowrite and cold-nowrite-related: no registry, so the result is
# the lookup cost a shared registry would have to beat on the head of the distribution.

- id: py-subprocess
  use_case: coding
  question: In the Python subprocess documentation, what is the default value of Popen's bufsize argument?
  expect: ['-1']
  check: {url: 'https://docs.python.org/3/library/subprocess.html', pattern: 'now defaults to -1'}
  related:
    question: In the Python subprocess documentation, which Windows priority-class constant for Popen's creationflags is the default?
    expect: ['NORMAL_PRIORITY_CLASS|normal']
    check: {url: 'https://docs.python.org/3/library/subprocess.html', pattern: 'will have a normal priority\. \(default\)'}

- id: py-argparse
  use_case: coding
  question: In the Python argparse documentation, what character replaces hyphens when dest defaults to an optional argument's name?
  expect: ['underscore|_']
  check: {url: 'https://docs.python.org/3/library/argparse.html', pattern: 'dest\]\(#dest\) parameter defaults to the argument name'}
  related:
    question: In the Python argparse documentation, what is the default title of the sub-parser group in help output when a description is provided?
    expect: ['subcommands']
    check: {url: 'https://docs.python.org/3/library/argparse.html', pattern: "'subcommands'"}

- id: mdn-set-cookie
  use_case: coding
  question: According to MDN's Set-Cookie page, what does the Path attribute default to if it is omitted?
  expect: ['path|director']
  check: {url: 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie', pattern: 'this attribute defaults to the path component of the request URL'}
  related:
    question: According to MDN's Set-Cookie page, if both Expires and Max-Age are set, which one has precedence?
    expect: ['max-age']
    check: {url: 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie', pattern: '(?i)max-age.{0,20}has precedence'}

- id: node-fs
  use_case: coding
  question: In the Node.js fs documentation, what is the default mode for fs.mkdir()?
  expect: ['0o777|777']
  check: {url: 'https://nodejs.org/api/fs.html', pattern: '0o777'}
  related:
    question: In the Node.js fs documentation, what is the default flag for fs.writeFile()?
    expect: ["\\bw\\b"]
    check: {url: 'https://nodejs.org/api/fs.html', pattern: "Default:\\*\\* `'w'`"}

- id: node-child-process
  use_case: coding
  question: In the Node.js child_process documentation, what is the default maxBuffer for child_process.exec()?
  expect: ['1024 ?\* ?1024|1,?048,?576|1 ?MiB|1 ?MB']
  check: {url: 'https://nodejs.org/api/child_process.html', pattern: '1024 \* 1024'}
  related:
    question: In the Node.js child_process documentation, what is the default killSignal for child_process.exec()?
    expect: ['SIGTERM']
    check: {url: 'https://nodejs.org/api/child_process.html', pattern: "Default:\\*\\* `'SIGTERM'`"}

- id: pg-connections
  use_case: coding
  question: In the PostgreSQL documentation on connection settings, what is the typical default value of max_connections?
  expect: ['\b100\b']
  check: {url: 'https://www.postgresql.org/docs/current/runtime-config-connection.html', pattern: 'typically 100 connections'}
  related:
    question: In the PostgreSQL documentation on connection settings, what is the default value of superuser_reserved_connections?
    expect: ['\b3\b']
    check: {url: 'https://www.postgresql.org/docs/current/runtime-config-connection.html', pattern: 'default value is three connections'}

