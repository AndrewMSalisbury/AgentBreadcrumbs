# Knowledge-gap probe libraries (research/knowledge-gap-probe.md). Hand-written list;
# research/scripts/libmeta.py fetches versions, release dates and downloads into
# libmeta.yaml. ecosystem: npm, pypi or cargo.
#
# terraform's aws provider was swapped for @aws-sdk/client-s3, since deps.dev
# (where release dates come from) doesn't cover the Terraform registry.
# The niche group comes from research/scripts/pickniche.py (niche_candidates.yaml):
# 2k-50k weekly downloads, first release 2024-06 to 2026-06 (2 years up to Sonnet 5.5's
# Jun 2026 reliable knowledge cutoff), seed 1. The first 2 per ecosystem, in shortlist
# order, that are importable libraries with docs and a changelog or releases. Rejected
# before them: npm @bitfinex/bfx-facs-http, @vijayee/wavedb (no changelog or releases);
# pypi githubkit-schemas-2022-11-28 (schema data for another library), ruff-format,
# pyspeex-noise (READMEs of 1.1k and 443 characters, no other docs); cargo
# trouble-host-macros, difficient-macros (macro crates for another crate), ldap3_lber
# (re-publish of the 2017 lber crate).

