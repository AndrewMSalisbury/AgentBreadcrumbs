# Knowledge-gap probe questions (research/knowledge-gap-probe.md), in tasks.yaml format:
#   python run.py verify --tasks ../research/probe/questions.yaml
#   python run.py memory --tasks ../research/probe/questions.yaml --out out_probe-0.1
#
# Each library has 3 `random` and 3 `changed` questions. Every question names a
# version, and every check reads a file pinned to a release tag, so answers don't drift.
#
# random:  public functions and methods in the library's API reference (requests:
#          docs/api.rst), listed from the source at the tag, shuffled with seed 1;
#          the first 3 that a one-line question can test.
# changed: changelog entries from 2025-06 on (12 months before Sonnet 5.5's Jun 2026
#          cutoff) that change something a caller sees (no internal fixes, docs or
#          test changes), drawn with random.Random(1).sample(..., 3).
#          changed_in gives the release and its date.
#
# kind: signature, exists (exists / deprecated / replaced), default, behavior,
#       exception, type, snippet.

# --- requests 2.34 (stable) --------------------------------------------------

- id: requests-cookiejar-set-none
  library: requests
  sample: random
  kind: behavior
  question: In requests 2.34, what does RequestsCookieJar.set(name, None) do?
  expect: ['remov|delet|unset|clear']
  check: {url: 'https://raw.githubusercontent.com/psf/requests/v2.34.2/src/requests/cookies.py', pattern: 'if value is None: remove_cookie_by_name\('}

- id: requests-response-json-error
  library: requests
  sample: random
  kind: exception
