  expect: ['requests\.(exceptions\.)?JSONDecodeError']
  check: {url: 'https://raw.githubusercontent.com/psf/requests/v2.34.2/src/requests/models.py', pattern: ':raises requests\.exceptions\.JSONDecodeError: If the response body does not contain valid json'}

